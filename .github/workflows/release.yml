name: Release

on:
  push:
    tags:
      - 'v*.*'
      - 'production-v*.*'
  # Retry a release by dispatching against its tag.
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_type == 'tag'
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@f588b830584a2eb0f83833c6da3b77c3ef24b180
    secrets:
      DEV_KEY: ${{ secrets.DEV_KEY }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The shared build can use a temporary key for tests; never publish that.
      - name: Require release signing key
        env:
          DEV_KEY: ${{ secrets.DEV_KEY }}
        run: test -n "$DEV_KEY"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*.s9pk'
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: '*.s9pk'
          fail_on_unmatched_files: true
