name: Release

on:
  push:
    tags:
      - 'v*.*'
  # Fallback: push events have not been triggering workflows on this repo
  # (both branch and tag pushes were silently ignored while dispatch works),
  # so releases can also be dispatched against a tag ref.
  workflow_dispatch:

jobs:
  release:
    uses: Start9Labs/start-technologies/.github/workflows/release.yml@master
    with:
      # Both vars are optional: unset, a release only attaches the s9pks to
      # the GitHub release (sideload distribution). Set RELEASE_REGISTRY once
      # a registry exists to also publish there.
      RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
      S3_S9PKS_BASE_URL: ${{ vars.S3_S9PKS_BASE_URL }}
    secrets:
      DEV_KEY: ${{ secrets.DEV_KEY }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
    permissions:
      contents: write
